<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pay Secure</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#1d4ed8,#0f172a 40%),
    radial-gradient(circle at bottom right,#06b6d4,#111827 45%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
}

.glow1{
    width:350px;
    height:350px;
    background:#2563eb;
    top:-100px;
    left:-100px;
    opacity:0.4;
}

.glow2{
    width:300px;
    height:300px;
    background:#06b6d4;
    bottom:-100px;
    right:-100px;
    opacity:0.3;
}

.container{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(18px);
    border-radius:34px;
    padding:32px 26px;
    position:relative;
    z-index:10;
    box-shadow:0 15px 50px rgba(0,0,0,0.45);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:58px;
    height:58px;
    border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:28px;
    font-weight:700;
    box-shadow:0 10px 30px rgba(37,99,235,0.45);
}

.brand-text h2{
    color:white;
    font-size:22px;
    font-weight:600;
}

.brand-text p{
    color:#cbd5e1;
    font-size:12px;
}

.secure-badge{
    background:rgba(34,197,94,0.18);
    color:#86efac;
    padding:8px 12px;
    border-radius:12px;
    font-size:12px;
    font-weight:600;
    border:1px solid rgba(34,197,94,0.25);
}

.card{
    background:rgba(255,255,255,0.06);
    border-radius:24px;
    padding:22px;
    border:1px solid rgba(255,255,255,0.08);
}

.label{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:8px;
}

.upi-id{
    color:white;
    font-size:18px;
    font-weight:600;
    word-break:break-all;
    margin-bottom:22px;
}

input{
    width:100%;
    height:68px;
    border:none;
    outline:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    padding:0 20px;
    color:white;
    font-size:24px;
    font-weight:600;
    text-align:center;
}

input::placeholder{
    color:#cbd5e1;
}

.generate-btn,
.pay-btn{
    width:100%;
    height:68px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:20px;
    font-weight:600;
    transition:0.3s;
}

.generate-btn{
    margin-top:22px;
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    color:white;
    box-shadow:0 10px 30px rgba(37,99,235,0.45);
}

.pay-btn{
    margin-top:22px;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:white;
    box-shadow:0 10px 30px rgba(34,197,94,0.35);
}

.generate-btn:hover,
.pay-btn:hover{
    transform:translateY(-2px);
}

/* QR */

#qrcode{
    margin-top:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.qr-box{
    position:relative;
    width:290px;
    height:290px;
    background:white;
    border-radius:30px;
    padding:18px;
    overflow:hidden;
    animation:zoomQR 0.5s ease;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

#realQR img{
    width:100% !important;
    height:100% !important;
    border-radius:18px;
}

.scan-line{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:linear-gradient(
    90deg,
    transparent,
    #06b6d4,
    #22c55e,
    transparent);
    box-shadow:
    0 0 20px #06b6d4,
    0 0 40px #22c55e;
    z-index:5;
    animation:scanner 2s linear infinite;
}

.corner{
    position:absolute;
    width:34px;
    height:34px;
    border:5px solid #2563eb;
    z-index:6;
}

.corner1{
    top:10px;
    left:10px;
    border-right:none;
    border-bottom:none;
}

.corner2{
    top:10px;
    right:10px;
    border-left:none;
    border-bottom:none;
}

.corner3{
    bottom:10px;
    left:10px;
    border-right:none;
    border-top:none;
}

.corner4{
    bottom:10px;
    right:10px;
    border-left:none;
    border-top:none;
}

/* STATUS */

.payment-status{
    margin-top:22px;
    display:none;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:18px;
    padding:16px;
}

.status-loader{
    width:22px;
    height:22px;
    border:3px solid rgba(255,255,255,0.2);
    border-top:3px solid #22c55e;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.status-text{
    color:white;
    font-size:15px;
    font-weight:500;
}

/* TRANSACTION */

.transaction{
    margin-top:18px;
    color:#e2e8f0;
    font-size:13px;
    display:none;
    word-break:break-all;
}

/* TIMER */

.timer{
    display:none;
    margin-top:18px;
    text-align:center;
    color:#f87171;
    font-size:30px;
    font-weight:700;
}

/* FOOTER */

.footer{
    margin-top:26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.footer-left{
    color:#cbd5e1;
    font-size:12px;
}

.live{
    display:flex;
    align-items:center;
    gap:8px;
    color:#86efac;
    font-size:13px;
    font-weight:600;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    animation:pulse 1s infinite;
}

/* ANIMATION */

@keyframes scanner{

    0%{
        top:0;
    }

    100%{
        top:100%;
    }

}

@keyframes zoomQR{

    0%{
        transform:scale(0.6);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

@keyframes spin{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}

@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.4);
        opacity:0.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

</style>
</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">

    <div class="topbar">

        <div class="brand">

            <div class="logo">
                ₹
            </div>

            <div class="brand-text">

                <h2>Pay Secure</h2>

                <p>India Trusted Payment Gateway</p>

            </div>

        </div>

        <div class="secure-badge">
            🔒 SECURE
        </div>

    </div>

    <div class="card">

        <div class="label">
            Merchant UPI ID
        </div>

        <div class="upi-id">
            cleantissuepaper@postbank
        </div>

        <input
        type="number"
        id="amount"
        placeholder="₹ Enter Amount">

        <button
        class="generate-btn"
        onclick="generateQR()">

            Generate Secure QR

        </button>

        <!-- QR -->

        <div id="qrcode"></div>

        <!-- TXN -->

        <div
        class="transaction"
        id="txnId">

            Transaction ID :
            <span id="txnNumber"></span>

        </div>

        <!-- TIMER -->

        <div
        class="timer"
        id="timer">

            02:00

        </div>

        <!-- PAYMENT STATUS -->

        <div
        class="payment-status"
        id="paymentStatus">

            <div class="status-loader"></div>

            <div class="status-text">
                💸payment processing💸
            </div>

        </div>

        <!-- PAY -->

        <button
        class="pay-btn"
        onclick="payNow()">

            Proceed To Pay

        </button>

    </div>

    <div class="footer">

        <div class="footer-left">
            100% Trusted Payment Gateway
        </div>

        <div class="live">

            <div class="dot"></div>

            LIVE

        </div>

    </div>

</div>

<script>

const upiID =
"cleantissuepaper@postbank";

let countdown;
let time = 120;

// TRANSACTION ID

function generateTransactionID(){

    return 'TXN-' +

    Math.random()
    .toString(36)
    .substring(2,10)
    .toUpperCase()

    +

    Date.now()
    .toString()
    .slice(-6);

}

// VALIDATE

function validateAmount(amount){

    if(amount < 10){

        alert("Minimum Amount ₹10");
        return false;

    }

    if(amount > 100000){

        alert("Maximum Amount ₹1,00,000");
        return false;

    }

    return true;

}

// GENERATE QR

function generateQR(){

    let amount =
    Number(document.getElementById("amount").value);

    if(amount == ""){

        alert("Please Enter Amount");
        return;

    }

    if(!validateAmount(amount)){

        return;

    }

    document.getElementById("qrcode")
    .innerHTML = "";

    clearInterval(countdown);

    time = 120;

    let txnID =
    generateTransactionID();

    document.getElementById("txnId")
    .style.display = "block";

    document.getElementById("txnNumber")
    .innerHTML = txnID;

    document.getElementById("timer")
    .style.display = "block";

    document.getElementById("paymentStatus")
    .style.display = "flex";

    let upiLink =

    `upi://pay?pa=${upiID}&pn=SecurePayment&tn=Payment&am=${amount}&cu=INR&tr=${txnID}`;

    // QR BOX

    let qrBox =
    document.createElement("div");

    qrBox.className =
    "qr-box";

    qrBox.innerHTML =

    `
    <div class="scan-line"></div>

    <div class="corner corner1"></div>
    <div class="corner corner2"></div>
    <div class="corner corner3"></div>
    <div class="corner corner4"></div>

    <div id="realQR"></div>
    `;

    document.getElementById("qrcode")
    .appendChild(qrBox);

    // QR

    new QRCode(

        document.getElementById("realQR"),

        {
            text:upiLink,
            width:250,
            height:250
        }

    );

    startTimer();

}

// TIMER

function startTimer(){

    let timer =
    document.getElementById("timer");

    countdown =
    setInterval(() => {

        let minutes =
        Math.floor(time / 60);

        let seconds =
        time % 60;

        seconds =
        seconds < 10
        ? "0" + seconds
        : seconds;

        timer.innerHTML =
        `${minutes}:${seconds}`;

        time--;

        if(time < 0){

            clearInterval(countdown);

            timer.innerHTML =
            "QR EXPIRED";

        }

    },1000);

}

// PAY

function payNow(){

    let amount =
    Number(document.getElementById("amount").value);

    if(amount == ""){

        alert("Please Enter Amount");
        return;

    }

    if(!validateAmount(amount)){

        return;

    }

    let txnID =
    document.getElementById("txnNumber")
    .innerHTML;

    let upiLink =

    `upi://pay?pa=${upiID}&pn=SecurePayment&tn=Payment&am=${amount}&cu=INR&tr=${txnID}`;

    window.location.href =
    upiLink;

}

</script>

</body>
</html>
